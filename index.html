<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="app.css" />
    <title>記事検索</title>
  </head>

  <body>
    <header><h1>記事検索 (Qiita)</h1></header>
    <div id="searchPanel">
      <label for="keyword"> <h2>記事を検索</h2> </label>
      キーワード
      <span id="must">必須</span>
      <form id="searchForm">
        <input
          type="text"
          id="keyword"
          placeholder="例）React 状態管理"
          aria-label="検索キーワード入力欄"
        />
        <button id="searchButton" aria-label="検索ボタン">検索</button>
      </form>
    </div>

    <div id="resultPanel">
      <h2>検索結果</h2>
      <p aria-live="polite" id="showStatus"></p>

      </div>
      <span style="color: red;">↑このdivをクリックしたら、記事の内容を少々ポップアップしたい
      </span> -->

</html>
